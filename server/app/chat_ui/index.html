<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aria · 文字聊天调试台</title>
    <link rel="stylesheet" href="/chat/debug/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="app-header">
        <div class="brand-copy">
          <p class="eyebrow">ARIA COMPANION HUB</p>
          <h1>文字聊天调试台</h1>
          <p class="subtitle">验证会话持久化、隐私路由和数据库模型配置是否即时生效。</p>
        </div>
        <a class="model-link" href="/admin/models">模型配置</a>
      </header>

      <section class="auth card">
        <label class="password-field">
          聊天密码
          <input id="password" type="password" autocomplete="current-password" placeholder="至少 12 位（首次设置）" />
        </label>
        <div class="auth-actions">
          <button id="login">登录</button>
          <button id="logout" class="secondary">退出</button>
        </div>
        <span id="status" class="status-pill" role="status" aria-live="polite">未连接</span>
      </section>

      <details id="setup-panel" class="card setup-panel">
        <summary>首次设置聊天身份</summary>
        <div class="setup-fields">
          <label>
            显示名称
            <input id="display-name" value="主人" maxlength="160" />
          </label>
          <label>
            管理 Token（仅首次设置）
            <input id="admin-token" type="password" autocomplete="off" placeholder="ARIA_ADMIN_TOKEN" />
          </label>
          <button id="setup">创建身份</button>
        </div>
      </details>

      <section class="workspace">
        <aside class="card">
          <div class="section-head">
            <h2>会话</h2>
            <button id="new-conversation" class="small" disabled>新建</button>
          </div>
          <div id="conversations" class="conversation-list"></div>
        </aside>

        <section class="card chat-card">
          <div id="messages" class="messages" role="log" aria-live="polite" aria-label="聊天消息">
            <div class="empty">连接后新建或选择一个会话。</div>
          </div>
          <form id="composer">
            <div class="privacy-row">
              <label>
                隐私级别
                <select id="privacy">
                  <option value="L0">L0 · 可公开</option>
                  <option value="L1" selected>L1 · 普通私密</option>
                  <option value="L2">L2 · 仅本地模型</option>
                </select>
              </label>
              <span id="privacy-note" class="muted">L1 可按配置使用云模型。</span>
            </div>
            <div class="compose-row">
              <div class="composer-input">
                <textarea id="text" rows="1" maxlength="20000" placeholder="输入一条测试消息…" aria-label="消息内容"></textarea>
                <span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
              </div>
              <div class="compose-actions">
                <button id="cancel" type="button" class="secondary" hidden>取消</button>
                <button id="send" type="submit" disabled>发送</button>
              </div>
            </div>
          </form>
        </section>
      </section>
    </main>
    <script src="/chat/debug/assets/app.js" defer></script>
  </body>
</html>
