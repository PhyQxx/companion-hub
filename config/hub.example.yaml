schema_version: 1

models:
  sensenova_dialogue:
    provider: openai_compatible
    model: deepseek-v4-flash
    supports_json_mode: false
    base_url: https://token.sensenova.cn/v1
    # 密钥支持两种方式（同时存在时优先使用 secret_value）：
    # 1. secret_value: 直接填写 API Key，适合后台管理
    # 2. secret_ref: env:XXX   引用环境变量，适合容器化部署
    # secret_value: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    secret_ref: env:SENSENOVA_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 12000
    max_retries: 1
    max_context_tokens: 131072
    input_cost_per_million: 0
    output_cost_per_million: 0

  sensenova_utility:
    provider: openai_compatible
    model: sensenova-6.8-flash-lite
    supports_json_mode: false
    base_url: https://token.sensenova.cn/v1
    secret_ref: env:SENSENOVA_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 6000
    max_retries: 1
    max_context_tokens: 131072
    input_cost_per_million: 0
    output_cost_per_million: 0

  sensenova_reasoning_fallback:
    provider: openai_compatible
    model: glm-5.2
    supports_json_mode: false
    base_url: https://token.sensenova.cn/v1
    secret_ref: env:SENSENOVA_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 20000
    max_retries: 0
    max_context_tokens: 131072
    input_cost_per_million: 0
    output_cost_per_million: 0

  local_private:
    provider: openai_compatible
    model: qwen3.6-35b-a3b-uncensored
    supports_json_mode: false
    # Qwen3.6 思考输出与正文共享预算，实测推理约 1400+ token；
    # 叠加开销后请求侧 512 的正文预算才能拿到可见 message.content。
    reasoning_overhead_tokens: 2048
    # LM Studio 原生管理 API 在 /api/v1/*；聊天仍走 OpenAI-compatible /v1。
    base_url: http://127.0.0.1:1234/v1
    runs_local: true
    max_privacy_level: L2
    # 思考型本地模型完整生成（推理 1400+ token + 正文）实测超过 30s，
    # 需要放宽到契约上限，否则 L2 回合在出正文前就被掐断。
    timeout_ms: 120000
    max_retries: 0
    max_context_tokens: 32768
    input_cost_per_million: 0
    output_cost_per_million: 0

  zhipu_text_free:
    kind: text
    provider: openai_compatible
    model: glm-4.7-flash
    supports_json_mode: true
    thinking_mode: disabled
    base_url: https://open.bigmodel.cn/api/paas/v4
    secret_ref: env:ZAI_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 30000
    max_retries: 1
    max_context_tokens: 204800

  zhipu_vision_free:
    kind: vision
    provider: zhipu_native
    model: glm-4.6v-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    secret_ref: env:ZAI_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 60000
    max_retries: 1
    max_context_tokens: 131072

  zhipu_image_free:
    kind: image_generation
    provider: zhipu_native
    model: cogview-3-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    secret_ref: env:ZAI_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 60000
    max_retries: 0

  zhipu_video_free:
    kind: video_generation
    provider: zhipu_native
    model: cogvideox-flash
    base_url: https://open.bigmodel.cn/api/paas/v4
    secret_ref: env:ZAI_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 120000
    max_retries: 0

routes:
  dialogue:
    primary: sensenova_dialogue
    # 云端限流/超时时优先回落到已加载的本地模型，避免免费云模型一起拥塞时整轮失败。
    fallbacks: [local_private, zhipu_text_free, sensenova_reasoning_fallback]
    timeout_ms: 12000
  utility:
    primary: sensenova_utility
    fallbacks: [sensenova_dialogue, zhipu_text_free]
    timeout_ms: 6000
  private:
    primary: local_private
    fallbacks: []
    timeout_ms: 30000

capability_models:
  vision: zhipu_vision_free
  image_generation: zhipu_image_free
  video_generation: zhipu_video_free

# P6 语音管线（后台「模型与路由 → 语音」可视化管理，保存即生效）。
# asr 为空表示语音识别未启用；tts 按顺序做故障转移（MiMo 为主、edge-tts 兜底）。
# MiMo 密钥建议直接在管理后台填 secret_value，无需写进本文件。
voice:
  asr: null
  # asr:
  #   provider: mimo
  #   model: mimo-v2.5-asr
  #   base_url: https://api.xiaomimimo.com/v1
  #   secret_value: <在管理后台填写 MiMo API Key>
  #   language: auto
  # L2 本地语音可改用 faster-whisper；无需 URL/Key，首次识别时延迟加载模型。
  # 当前作为可选本地运行依赖，不随 Hub 基础依赖自动安装。
  # asr:
  #   provider: faster_whisper
  #   model: small
  #   base_url: null
  #   language: zh
  #   device: cpu
  #   compute_type: int8
  #   runs_local: true
  tts:
    - provider: edge_tts
      voice: zh-CN-XiaoxiaoNeural

observability:
  log_level: INFO
  trace_sample_rate: 1.0
  retain_days: 14
