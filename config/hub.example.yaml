schema_version: 1

models:
  sensenova_dialogue:
    provider: openai_compatible
    model: deepseek-v4-flash
    supports_json_mode: false
    base_url: https://token.sensenova.cn/v1
    secret_ref: env:SENSENOVA_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 12000
    max_retries: 1
    max_context_tokens: 131072
    input_cost_per_million: 0
    output_cost_per_million: 0

  sensenova_utility:
    provider: openai_compatible
    model: sensenova-6.8-flash-lite
    supports_json_mode: false
    base_url: https://token.sensenova.cn/v1
    secret_ref: env:SENSENOVA_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 6000
    max_retries: 1
    max_context_tokens: 131072
    input_cost_per_million: 0
    output_cost_per_million: 0

  sensenova_reasoning_fallback:
    provider: openai_compatible
    model: glm-5.2
    supports_json_mode: false
    base_url: https://token.sensenova.cn/v1
    secret_ref: env:SENSENOVA_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 20000
    max_retries: 0
    max_context_tokens: 131072
    input_cost_per_million: 0
    output_cost_per_million: 0

  local_private:
    provider: openai_compatible
    model: qwen2.5:7b
    supports_json_mode: false
    base_url: http://127.0.0.1:11434/v1
    runs_local: true
    max_privacy_level: L2
    timeout_ms: 30000
    max_retries: 0
    max_context_tokens: 32768
    input_cost_per_million: 0
    output_cost_per_million: 0

  glm53_dialogue:
    # Coding Plan Pro is restricted to supported coding tools. Enable this profile
    # only with a separate API-authorized key and verified runtime terms.
    enabled: false
    provider: openai_compatible
    model: glm-5.3
    supports_json_mode: true
    base_url: https://open.bigmodel.cn/api/paas/v4
    secret_ref: env:ZAI_API_KEY
    runs_local: false
    max_privacy_level: L1
    timeout_ms: 20000
    max_retries: 1
    max_context_tokens: 131072
    input_cost_per_million: 0
    output_cost_per_million: 0

routes:
  dialogue:
    primary: sensenova_dialogue
    fallbacks: [sensenova_reasoning_fallback]
    timeout_ms: 12000
  utility:
    primary: sensenova_utility
    fallbacks: [sensenova_dialogue]
    timeout_ms: 6000
  private:
    primary: local_private
    fallbacks: []
    timeout_ms: 30000

observability:
  log_level: INFO
  trace_sample_rate: 1.0
  retain_days: 14
