<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fc" />
    <title>Aria · 离线</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f6f8fc;color:#172033;font-family:-apple-system,"PingFang SC",sans-serif}.card{width:min(360px,100%);padding:28px;border:1px solid #e3e8f2;border-radius:20px;background:#fff;box-shadow:0 12px 40px rgba(36,50,82,.08);text-align:center}.orb{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,#f2b6aa,#8d79cf);color:#fff;font-size:24px;font-weight:700}h1{margin:0 0 8px;font-size:22px}p{margin:0 0 20px;color:#68748a;line-height:1.6}button{min-height:44px;padding:9px 18px;border:0;border-radius:10px;background:#4f6df5;color:#fff;font:inherit;font-weight:600}
    </style>
  </head>
  <body><main class="card"><div class="orb">A</div><h1>暂时无法连接 Aria</h1><p>消息不会在离线时发送。请检查网络或 Hub 状态后重试。</p><button onclick="location.reload()">重新连接</button></main></body>
</html>
