services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aria}
      POSTGRES_USER: ${POSTGRES_USER:-aria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-aria}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_DEVICE_ID: ${MQTT_DEVICE_ID:-ld2410_bedroom}
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME:-aria_ld2410_bedroom}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}}
    entrypoint: ["/mosquitto/config/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -u $${MQTT_USERNAME} -P $${MQTT_PASSWORD} -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/entrypoint.sh:/mosquitto/config/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  hub:
    build:
      context: .
    env_file:
      - .env.docker
    environment:
      ARIA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aria}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aria}
      # dev 事件注入接口可伪造感知事件：仅在本地开发时显式开启
      ARIA_ENABLE_DEV_ENDPOINTS: ${ARIA_ENABLE_DEV_ENDPOINTS:-false}
      ARIA_MQTT_HOST: mosquitto
      ARIA_MQTT_PORT: "1883"
      ARIA_MQTT_USERNAME: ${MQTT_USERNAME:-aria}
      ARIA_MQTT_PASSWORD: ${MQTT_PASSWORD}
      ARIA_MQTT_ENABLED: ${ARIA_MQTT_ENABLED:-false}
      ARIA_LOG_LEVEL: ${ARIA_LOG_LEVEL:-INFO}
      ARIA_CONFIG_PATH: ${ARIA_CONFIG_PATH:-config/hub.example.yaml}
      ARIA_WATCH_CONFIG: ${ARIA_WATCH_CONFIG:-true}
      ARIA_ADMIN_TOKEN: ${ARIA_ADMIN_TOKEN:-}
      ARIA_VAPID_PRIVATE_KEY: ${ARIA_VAPID_PRIVATE_KEY:-}
      ARIA_XIAOAI_CONFIG_PATH: /var/lib/aria/xiaoai/config.json
      # BK-01 备份状态检视：只读挂载，转储仍由 backup profile 容器执行
      ARIA_BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8000:8000"
    volumes:
      - xiaoai-state:/var/lib/aria/xiaoai
      - ./backups:/backups:ro
    restart: unless-stopped

  aria-vpn:
    image: tailscale/tailscale:latest
    profiles: ["vpn"]
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY:-}
      TS_EXTRA_ARGS: --advertise-routes=${ARIA_SUBNET:-172.28.0.0/24} --hostname=aria-hub
      TS_ACCEPT_DNS: "false"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  xiaoai-gateway:
    build:
      context: ./integrations/xiaoai_gateway
    profiles: ["xiaoai"]
    environment:
      ARIA_HUB_XIAOAI_URL: ws://hub:8000/ws/adapters/xiaoai
      XIAOAI_CONFIG_PATH: /data/config.json
      XIAOAI_STATE_PATH: /data/state.json
    depends_on:
      hub:
        condition: service_healthy
    volumes:
      - xiaoai-state:/data
    restart: unless-stopped

  # 数据库每日逻辑备份（BK-01）：与 postgres 同镜像保证 pg_dump 版本一致；
  # 备份落在宿主机 ./backups/，恢复步骤见 docs/07「数据备份与恢复（BK-01）」。
  backup:
    image: pgvector/pgvector:pg16
    profiles: ["backup"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      # 容器默认 UTC：显式给 TZ 让 ARIA_BACKUP_AT 的 03:30 是本地凌晨
      TZ: ${ARIA_BACKUP_TZ:-Asia/Shanghai}
      PGUSER: ${POSTGRES_USER:-aria}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-aria}
      ARIA_BACKUP_AT: ${ARIA_BACKUP_AT:-03:30}
      ARIA_BACKUP_KEEP_DAYS: ${ARIA_BACKUP_KEEP_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/aria-backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/bash", "/usr/local/bin/aria-backup.sh"]
    restart: unless-stopped

volumes:
  postgres-data:
  mosquitto-data:
  xiaoai-state:
  tailscale-state:

networks:
  default:
    ipam:
      config:
        - subnet: ${ARIA_SUBNET:-172.28.0.0/24}
