[package]
name = "aria-desktop-client"
version = "0.1.0"
description = "Aria secure desktop capability client"
authors = ["Aria Companion Hub contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "aria_desktop_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
keyring = { version = "4.1", default-features = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
