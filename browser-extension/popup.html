<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aria Browser Bridge</title>
    <style>
      :root { font: 14px/1.5 system-ui, sans-serif; color: #172033; background: #f5f7fb; }
      body { width: 340px; margin: 0; padding: 18px; box-sizing: border-box; }
      h1 { margin: 0 0 4px; font-size: 18px; } p { margin: 0 0 14px; color: #60708c; }
      label { display: grid; gap: 5px; margin: 10px 0; font-weight: 600; }
      input { padding: 9px 10px; border: 1px solid #ccd4e3; border-radius: 8px; font: inherit; }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      button { border: 0; border-radius: 8px; padding: 9px 13px; font: inherit; font-weight: 700; cursor: pointer; }
      #pair { color: white; background: #4967e8; } #forget { background: #e8ecf4; color: #33405a; }
      #status { margin-top: 14px; padding: 9px 10px; border-radius: 8px; background: #e8ecf4; color: #33405a; }
      small { display: block; margin-top: 12px; color: #71809b; }
    </style>
  </head>
  <body>
    <h1>Aria Browser Bridge</h1>
    <p>让已配对的 Hub 按需读取当前标签页；不会持续监控浏览历史。</p>
    <form id="pair-form">
      <label>Hub 地址<input id="hub-url" type="url" placeholder="http://127.0.0.1:8000" required /></label>
      <label>配对码<input id="pairing-code" type="password" autocomplete="off" required /></label>
      <label>设备别名<input id="alias" maxlength="80" placeholder="我的浏览器" /></label>
      <div class="actions"><button id="pair" type="submit">授权并配对</button><button id="forget" type="button">解除配对</button></div>
    </form>
    <div id="status">正在读取状态…</div>
    <small>配对时浏览器会请求网页访问权限；浏览器内部页面、扩展页和商店页始终不可读取。</small>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
