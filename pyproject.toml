[project]
name = "aria-companion-hub"
version = "0.1.0"
description = "Local-first companion hub with extensible input and output adapters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "edge-tts>=7.2.8",
  "aiomqtt>=2.0,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28.1",
  "litellm>=1.75,<2",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2,<2",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["server", "integrations/open_llm_vtuber/src"]
testpaths = ["server/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["server", "integrations/open_llm_vtuber/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
files = ["server/app", "server/tests"]
mypy_path = "server:integrations/open_llm_vtuber/src"
